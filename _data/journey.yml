- id: beginnings
  period: Before graduate study
  context: Undergraduate research · BUET · Completed 2015
  title: Finding connections across disciplines.
  summary: What if a method for understanding images could help us understand proteins?
  details: My early research applied computer-vision descriptors to protein tertiary structure retrieval. It established an enduring interest in transferring useful ideas across disciplines, and letting the application shape the method.
  links:
