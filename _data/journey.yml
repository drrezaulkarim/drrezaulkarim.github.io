- id: phd
  period: 2019–2024
  context: Ph.D. · York University · Professor Richard P. Wildes
  title: Understanding a changing world.
  summary: Understanding a video means connecting what is visible now with what changes over time.
  details: Under the supervision of Professor Richard P. Wildes, I developed spatial-temporal attention models for video understanding. MED-VT uses a multiscale encoder-decoder video transformer for segmentation; MED-VT++ extends this line of research to multimodal learning. My doctoral thesis brings these investigations together as Spatial-Temporal Attention Models for Video Understanding.
  image: /medvt/data/medvt_fig_2.png
  image_alt: MED-VT multiscale encoder-decoder video transformer architecture
  image_width: 1212
  image_height: 446
  caption: MED-VT · Connecting information across spatial scales and time for video segmentation.
