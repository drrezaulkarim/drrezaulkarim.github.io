- id: foundation-models
  period: 2024–Present
  context: Senior Researcher · Huawei Canada
  title: Scaling language and multimodal foundation models.
  summary: Greater capability needs more than a larger model. It needs efficient ways to learn, adapt, and serve.
  details: My industry research focuses on large language models (LLMs) and multimodal foundation models, including vision-language models (VLMs). I develop and evaluate methods that connect model capability with the realities of large-scale computing.
  focus:
    - name: Efficient pretraining
      description: Activation sharing, caching, distributed parallelism, and communication optimization to make large-scale training more practical.
    - name: Efficient post-training
      description: Adaptation, alignment, and reinforcement learning, with attention to convergence stability and the cost of developing new capabilities.
    - name: Efficient model serving
      description: Inference efficiency, latency, and deployment constraints, including speculative decoding research for efficient reinforcement learning.
  links:
    - label: ECHO-LLaMA · EMNLP 2025
      url: https://scholar.google.com/citations?view_op=view_citation&user=sgKzrSgAAAAJ&citation_for_view=sgKzrSgAAAAJ:WF5omc3nYNoC
    - label: EPAS · Canadian AI 2026
      url: https://arxiv.org/abs/2601.19089
    - label: CommFuse · 2026
      url: https://arxiv.org/abs/2604.24013

- id: experience
  period: Looking ahead
  context: Continuing research direction · Language, vision, and action
  title: AI that learns from experience.
  future: true
  summary: Remembering a fact and learning a skill are different capabilities. Useful agents need both.
  details: I am interested in memory-augmented systems that use feedback and experience to develop reusable skills. This direction connects procedural memory, skill libraries, reinforcement learning, and long-horizon tool use, with an ambition to support learning across modalities.
  focus:
    - name: Dialogue agents
      description: Remember relevant facts, preferences, and conversational context, and use feedback to improve future interactions.
    - name: Autonomous agents
      description: Learn from action outcomes, refine planning and tool use, and build skills that transfer to new tasks.
    - name: Coding agents
      description: Retain repository context and prior solutions, and learn from tests, failures, and successful development workflows.
