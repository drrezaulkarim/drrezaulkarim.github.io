- id: driving
  period: 2022–2023
  context: Industry chapter during the Ph.D. · Huawei Canada
  title: From perception to anticipation.
  summary: For an autonomous vehicle, recognizing the scene is only part of the problem. What happens next matters too.
  details: As a research intern with the Autonomous Driving Research Team at Noah's Ark Lab, I worked on vehicle trajectory prediction with attention to efficiency and robustness. This work led to DESTINE and a related trajectory-prediction patent application, filed in 2023 and published in 2025.
