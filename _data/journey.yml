      url: https://www.nature.com/articles/srep13275

- id: masters
  period: 2017–2019
  context: M.Sc. · University of Manitoba · Professor Neil Bruce
  title: Learning to see, efficiently.
  summary: A first prediction is not always the best one. Feedback and iterative refinement can help a model understand a scene more effectively.
  details: During graduate studies with Professor Neil Bruce, I investigated recurrent and distributed gating for semantic segmentation, alongside adversarial robustness and lossless image compression. Collaborative work on stock-price prediction broadened my experience with noisy temporal data and financial applications.
