- id: foundation-models
  category: foundation
  title: Efficient foundation models
  framing: Making LLM training and serving faster and cheaper at scale.
  flagships:
    - title: EPAS
      venue: Canadian AI 2026 · PMLR 318
      description: Progressive activation sharing for LLaMA 125M–7B, with similar loss to the baseline.
      metric: Up to 11.1% higher training throughput · Up to 29% higher inference throughput
      detail: Up to 10% higher average accuracy than SOTA when converting TinyLLaMA via continual pretraining.
      links:
        - label: Paper
          url: https://proceedings.mlr.press/v318/karim26a.html
        - label: arXiv
          url: https://arxiv.org/abs/2601.19089
    - title: ECHO-LLaMA
      venue: EMNLP 2025 (Industry)
      description: Co-developed efficient caching for LLaMA training; second author.
      metric: Up to 77% higher training tokens/s · Up to 16% higher MFU
      detail: Up to 14% lower loss at equal tokens; ~7% higher test-time throughput for the 1.1B model.
      links:
        - label: Paper
          url: https://aclanthology.org/2025.emnlp-industry.156/
  supporting:
    - title: CommFuse
      venue: arXiv · 2026
      description: "Layer-level: up to 99.8% communication overhead hidden (vs 83.9% for data slicing), with 36.9% lower latency vs baseline. More than 99% hidden across 1K–16K sequence lengths."
      url: https://arxiv.org/abs/2604.24013
    - title: Distributed Hybrid Parallelism for Large Language Models
      venue: arXiv · 2026
      description: Comparative study and system design guide for distributed LLM training.
      url: https://arxiv.org/abs/2602.09109
    - title: Zero-overhead tensor parallelism
      venue: Patent submission · 2025
      description: Research into reducing the systems overhead of scalable LLM training.
      url: "#patents"
      disclosure_todo: true

