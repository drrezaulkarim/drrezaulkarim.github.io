- id: agents
  category: agents
  title: Agents that learn from experience
  framing: Remembering a fact and learning a skill are different capabilities. Useful agents need both.
  vision: true
  details: "Should learning end when training ends? Humans continue learning long after school, drawing on increasingly diverse experiences. That motivates my research into AI that keeps learning through interaction with the world: reflecting on experience to develop useful, actionable insights, beyond remembering past facts. Memory-augmented agents are one promising direction, connecting feedback, procedural memory, and reusable skills to improve future decisions and actions."
  focus:
    - name: Dialogue agents
      description: Remember relevant facts, preferences, and conversational context, and use feedback to improve future interactions.
    - name: Autonomous agents
      description: Learn from action outcomes, refine planning and tool use, and build skills that transfer to new tasks.
    - name: Coding agents
      description: Retain repository context and prior solutions, and learn from tests, failures, and successful development workflows.
